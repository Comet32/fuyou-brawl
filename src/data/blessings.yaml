# 创意工坊描述里列出的 3 个示例福佑（原文），完整列表待从 VPK 本地化文件导入。
- id: wolf-core
  name: 狼王内丹
  category: 团队类
  effect: 在双方泉水刷新 3 次狼王内丹，每个内丹被拾取时，拾取者冷却时间 -8%，福佑持有者冷却时间 -3%
  numbers: { 刷新次数: 3, 拾取者冷却时间: '-8%', 持有者冷却时间: '-3%' }
  tags: [冷却]
  sources: [https://steamcommunity.com/sharedfiles/filedetails/?id=2841152696]
- id: electric-hammer
  name: 电锤思维
  category: 装备类
  effect: 获得 3500 金币。首次携带黯灭时，将其升级为雷神之锤（真）
  numbers: { 金币: 3500 }
  tags: [经济, 黯灭]
  sources: [https://steamcommunity.com/sharedfiles/filedetails/?id=2841152696]
- id: rescue
  name: 救救救救救
  category: 其他
  effect: 阵亡后召唤墓碑，若墓碑附近只有友军，3 秒后原地复活；墓碑期间可以使用商店和选择福佑
  numbers: { 复活等待: 3 秒 }
  tags: [复活]
  sources: [https://steamcommunity.com/sharedfiles/filedetails/?id=2841152696]
